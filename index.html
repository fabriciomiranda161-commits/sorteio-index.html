<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio Studio Queens</title>
  <style>
    :root {
      --bg: #0f0b0d;
      --panel: #181012;
      --panel-soft: #23171a;
      --paper: #fffaf2;
      --ink: #fff6e8;
      --muted: #c7b8a4;
      --line: rgba(225, 190, 126, .22);
      --gold: #d9b66d;
      --gold-strong: #f1d08c;
      --wine: #7e2148;
      --green: #0f8d5a;
      --shadow: rgba(0, 0, 0, .32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(217, 182, 109, .20), transparent 25%),
        radial-gradient(circle at 86% 12%, rgba(126, 33, 72, .34), transparent 28%),
        linear-gradient(135deg, #0f0b0d 0%, #171013 45%, #2d1420 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 72%);
    }

    .wrap {
      position: relative;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 34px 18px 54px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.05;
      color: #fff8eb;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .mark {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 32% 20%, #3d2c1d, #080607 64%);
      color: var(--gold-strong);
      font-weight: 900;
      border: 1px solid rgba(241, 208, 140, .72);
      box-shadow: 0 0 0 6px rgba(217, 182, 109, .08), 0 16px 34px var(--shadow);
      flex: 0 0 auto;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.4fr .8fr .8fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric,
    .client,
    .state {
      background: rgba(255, 250, 242, .08);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 44px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .metric {
      min-height: 82px;
      padding: 17px 18px;
    }

    .metric span {
      display: block;
      color: #d9cbb8;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 17px;
      color: #fff8eb;
    }

    .draw {
      position: relative;
      overflow: hidden;
      min-height: 420px;
      margin-bottom: 18px;
      padding: 34px 22px;
      color: #fff;
      border: 1px solid rgba(241, 208, 140, .26);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015)),
        radial-gradient(circle at 50% -12%, rgba(241, 208, 140, .25), transparent 28%),
        linear-gradient(145deg, #150e11 0%, #241318 45%, #591a39 100%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .42);
    }

    .draw::before {
      content: "";
      position: absolute;
      inset: -80px;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(241, 208, 140, .18), transparent 24%),
        radial-gradient(circle at 76% 22%, rgba(255, 255, 255, .11), transparent 18%),
        linear-gradient(90deg, transparent, rgba(241, 208, 140, .10), transparent);
      transform: rotate(-8deg);
    }

    .drawInner {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .drawLabel {
      color: var(--gold-strong);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .prizeTabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: -4px 0 20px;
    }

    .prizeTab {
      min-height: 34px;
      border: 1px solid rgba(241, 208, 140, .34);
      border-radius: 999px;
      padding: 7px 13px;
      background: rgba(255, 250, 242, .08);
      color: #f6e3bd;
      cursor: pointer;
      font-weight: 900;
      font-size: 13px;
    }

    .prizeTab.active {
      background: linear-gradient(135deg, #f1d08c, #bd8840);
      color: #171014;
      border-color: transparent;
    }

    .prizeTab.done {
      box-shadow: inset 0 0 0 1px rgba(18, 140, 85, .70);
    }

    .countdown {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff4d8;
      border: 1px solid rgba(241, 208, 140, .88);
      background: radial-gradient(circle at 50% 30%, rgba(241, 208, 140, .18), rgba(0, 0, 0, .24));
      font-size: 22px;
      font-weight: 900;
      box-shadow: inset 0 0 22px rgba(241, 208, 140, .10), 0 0 0 10px rgba(241, 208, 140, .06);
    }

    .countdown.big {
      animation: pulse .72s ease-in-out;
    }

    .winner {
      min-height: 136px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 1px solid rgba(241, 208, 140, .38);
      border-radius: 18px;
      background: rgba(12, 8, 9, .38);
      color: #fff1c8;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.12;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .winner small {
      display: block;
      color: #ddcdb6;
      margin-top: 12px;
      font-size: 14px;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      font-weight: 800;
    }

    .winner.sorting {
      color: #fff;
      animation: shine .22s linear infinite;
    }

    .winner.final {
      border-color: rgba(241, 208, 140, .78);
      background: linear-gradient(135deg, rgba(241, 208, 140, .14), rgba(255, 255, 255, .05));
    }

    .winner.invalid {
      border-color: rgba(241, 110, 110, .72);
      background: linear-gradient(135deg, rgba(160, 45, 55, .22), rgba(255, 255, 255, .05));
    }

    .hint {
      color: #d8c7b0;
      font-size: 14px;
      margin: 14px 0 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn,
    .linkBtn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .btn {
      background: linear-gradient(135deg, #f1d08c, #bd8840);
      color: #171014;
      box-shadow: 0 14px 28px rgba(0, 0, 0, .22);
    }

    .btn:hover,
    .linkBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .78;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .client {
      padding: 16px;
      transition: border-color .22s ease, box-shadow .22s ease, transform .22s ease, background .22s ease;
    }

    .client.winnerCard {
      border-color: rgba(241, 208, 140, .92);
      background:
        linear-gradient(135deg, rgba(241, 208, 140, .20), rgba(255, 250, 242, .08)),
        rgba(255, 250, 242, .08);
      box-shadow: 0 0 0 1px rgba(241, 208, 140, .24), 0 24px 58px rgba(0, 0, 0, .42);
      transform: translateY(-2px);
    }

    .client.winnerCard .badge {
      background: linear-gradient(135deg, #fff1be, #f1c15f);
      box-shadow: 0 0 0 5px rgba(241, 208, 140, .12);
    }

    .client.invalidWinnerCard {
      border-color: rgba(241, 110, 110, .66);
      background:
        linear-gradient(135deg, rgba(160, 45, 55, .26), rgba(255, 250, 242, .07)),
        rgba(255, 250, 242, .08);
    }

    .clientTop {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: start;
    }

    .badge {
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1012;
      background: linear-gradient(135deg, #f4d999, #c99a4f);
      font-weight: 900;
      font-size: 13px;
    }

    .client h2 {
      margin: 0;
      color: #fff8eb;
      font-size: 18px;
      line-height: 1.15;
    }

    .client p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .row.procedure {
      grid-column: 1 / -1;
    }

    .row.full {
      grid-column: 1 / -1;
    }

    .row.invalidProcedure {
      border-color: rgba(241, 110, 110, .40);
      background: rgba(160, 45, 55, .18);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 26px;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(241, 110, 110, .44);
      background: rgba(160, 45, 55, .22);
      color: #ffd9d9;
      font-size: 12px;
      font-weight: 900;
    }

    .row {
      border: 1px solid rgba(225, 190, 126, .16);
      border-radius: 12px;
      padding: 10px 11px;
      background: rgba(255, 250, 242, .07);
    }

    .row span {
      display: block;
      color: #bba994;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .row strong {
      color: #fff6e8;
      font-size: 14px;
      word-break: break-word;
    }

    .state {
      padding: 22px;
      color: #dccdb9;
      font-size: 16px;
    }

    .confetti {
      position: absolute;
      top: -14px;
      width: 8px;
      height: 14px;
      background: var(--gold-strong);
      opacity: .95;
      animation: fall 2s linear forwards;
    }

    @keyframes pulse {
      0% { transform: scale(.84); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes shine {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.38); }
      100% { filter: brightness(1); }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); }
      100% { transform: translateY(360px) rotate(560deg); opacity: 0; }
    }

    @media (max-width: 920px) {
      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 24px 12px 34px;
      }

      header {
        gap: 12px;
      }

      h1 {
        font-size: 34px;
      }

      .summary,
      .list,
      .info {
        grid-template-columns: 1fr;
      }

      .draw {
        min-height: 360px;
        padding: 26px 14px;
        border-radius: 20px;
      }

      .countdown {
        width: 88px;
        height: 88px;
      }

      .winner {
        min-height: 120px;
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="brand">Studio Queens</div>
        <h1>Sorteio de Clientes</h1>
        <p class="subtitle" id="subtitle">Carregando sorteio...</p>
      </div>
      <div class="mark">SQ</div>
    </header>

    <section class="summary">
      <div class="metric">
        <span>Período</span>
        <strong id="periodo">Carregando...</strong>
      </div>
      <div class="metric">
        <span>Participantes</span>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <span>Regra</span>
        <strong id="regra">-</strong>
      </div>
    </section>

    <section class="draw">
      <div class="drawInner">
        <div class="drawLabel">Sorteio Studio Queens</div>
        <div class="prizeTabs" id="premios"></div>
        <div class="countdown" id="countdown">...</div>
        <div class="winner" id="winner">Buscando participantes.</div>
        <p class="hint" id="hint">Aguarde um instante.</p>
        <div class="actions">
          <button class="btn" id="sortear" type="button" disabled>Sortear</button>
        </div>
      </div>
    </section>

    <section class="list" id="lista"></section>
  </main>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbysG8bdGgz9FTO1UTH4drZegPiP3XKHMiGfySx0-aAN7MEiHDc_g1lju7ZQCMMDZ78/exec"
    };

    const params = new URLSearchParams(location.search);
    const codigo = (params.get("s") || "").trim();
    const chaveResultadoLocal = codigo ? "studioQueensResultadoSorteio:" + codigo : "";
    const chaveResultadosLocal = codigo ? "studioQueensResultadosSorteio:" + codigo : "";
    let participantes = [];
    let resultados = [];
    let premioAtual = 1;
    let quantidadePremios = 1;
    let recebeuDadosDireto = false;
    let sorteioCarregado = false;
    let sorteioEmAndamento = false;
    const chavesInvalidasSorteadas = new Set();

    const $ = id => document.getElementById(id);

    function esc(texto) {
      return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function jsonp(extraParams, tempoLimiteMs) {
      return new Promise((resolve, reject) => {
        const callback = "sq_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Tempo esgotado ao conectar com o Google."));
        }, tempoLimiteMs || 45000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = data => {
          cleanup();
          resolve(data);
        };

        const url = new URL(CONFIG.apiUrl);
        Object.entries(extraParams).forEach(([chave, valor]) => url.searchParams.set(chave, valor));
        url.searchParams.set("callback", callback);
        url.searchParams.set("_", Date.now().toString());
        script.onerror = () => {
          cleanup();
          reject(new Error("Falha ao carregar dados do Google."));
        };
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function mostrarErro(texto) {
      $("winner").textContent = texto;
      $("hint").textContent = "Atualize a página. Se continuar, gere um novo link pelo robô.";
      $("countdown").textContent = "Erro";
      $("sortear").textContent = "Sem dados";
      $("sortear").disabled = true;
      $("lista").innerHTML = '<div class="state">' + esc(texto) + '</div>';
    }

    function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function buscarSorteioGoogleComTentativas() {
      let ultimoErro = null;

      for (let tentativa = 1; tentativa <= 3; tentativa++) {
        try {
          $("hint").textContent = "Conectando com o Google. Tentativa " + tentativa + " de 3.";
          return await jsonp({ api: "sorteio", s: codigo }, 45000);
        } catch (e) {
          ultimoErro = e;
          $("hint").textContent = "O Google demorou para responder. Tentando novamente...";
          await esperar(1800);
        }
      }

      throw ultimoErro || new Error("Falha ao conectar com o Google.");
    }

    function numeroPremio(valor) {
      const numero = Number(valor);
      return numero > 0 ? numero : 1;
    }

    function resultadoDoPremio(numero) {
      const alvo = numeroPremio(numero);
      return resultados.find(item => numeroPremio(item && item.premioNumero) === alvo) || null;
    }

    function normalizarResultados(lista) {
      const itens = Array.isArray(lista) ? lista : (lista ? [lista] : []);
      const porPremio = new Map();

      itens.forEach(item => {
        if (!item || item.tipoResultado === "procedimento_invalido") return;
        const premioNumero = numeroPremio(item.premioNumero);
        porPremio.set(premioNumero, { ...item, premioNumero });
      });

      return [...porPremio.values()].sort((a, b) => numeroPremio(a.premioNumero) - numeroPremio(b.premioNumero));
    }

    function salvarResultadosLocal() {
      if (!chaveResultadosLocal) return;

      try {
        localStorage.setItem(chaveResultadosLocal, JSON.stringify(resultados));
      } catch (e) {
      }
    }

    function buscarResultadosLocal() {
      if (!chaveResultadosLocal && !chaveResultadoLocal) return [];

      try {
        const novos = JSON.parse(localStorage.getItem(chaveResultadosLocal) || "[]");
        if (Array.isArray(novos) && novos.length) return normalizarResultados(novos);

        const antigo = JSON.parse(localStorage.getItem(chaveResultadoLocal) || "null");
        return normalizarResultados(antigo);
      } catch (e) {
        return [];
      }
    }

    function aplicarSorteio(sorteio) {
      if (sorteioEmAndamento) return;

      participantes = Array.isArray(sorteio.participantes) ? sorteio.participantes : [];
      quantidadePremios = Math.max(1, Number(sorteio.quantidadePremios || 1));
      resultados = normalizarResultados([
        ...normalizarResultados(sorteio.resultados || []),
        ...normalizarResultados(sorteio.resultado || null),
        ...buscarResultadosLocal()
      ]);
      sorteioCarregado = true;

      $("subtitle").textContent = (sorteio.profissionais || []).join(", ") || "Clientes do mês";
      $("periodo").textContent = (sorteio.inicioBr || "") + " até " + (sorteio.fimBr || "");
      $("total").textContent = String(participantes.length);
      $("regra").textContent = sorteio.regra || "-";
      renderizarPremios();
      renderizarLista();
      atualizarTelaDoPremio();
    }

    function renderizarPremios() {
      const container = $("premios");

      if (quantidadePremios <= 1) {
        container.innerHTML = "";
        return;
      }

      container.innerHTML = Array.from({ length: quantidadePremios }, (_, indice) => {
        const numero = indice + 1;
        const classes = ["prizeTab"];
        if (numero === premioAtual) classes.push("active");
        if (resultadoDoPremio(numero)) classes.push("done");

        return '<button class="' + classes.join(" ") + '" type="button" data-premio="' + numero + '">Prêmio ' + numero + '</button>';
      }).join("");

      container.querySelectorAll(".prizeTab").forEach(botao => {
        botao.addEventListener("click", () => {
          if (sorteioEmAndamento) return;
          premioAtual = numeroPremio(botao.dataset.premio);
          renderizarPremios();
          atualizarTelaDoPremio();
          renderizarLista();
        });
      });
    }

    function atualizarTelaDoPremio() {
      const resultadoAtual = resultadoDoPremio(premioAtual);

      if (resultadoAtual) {
        mostrarVencedora(resultadoAtual, true);
        return;
      }

      $("winner").className = "winner";
      $("winner").textContent = quantidadePremios > 1
        ? "Clique em sortear para escolher o Prêmio " + premioAtual + "."
        : "Clique em sortear para escolher a ganhadora.";
      $("hint").textContent = "Os nomes vão girar antes do resultado final.";
      $("countdown").textContent = "Pronto";
      $("sortear").textContent = "Sortear";
      $("sortear").disabled = !participantesDisponiveis().length;
      destacarCardGanhadora(null);
    }

    function renderizarLista() {
      if (!participantes.length) {
        $("lista").innerHTML = '<div class="state">Nenhuma participante encontrada neste sorteio.</div>';
        return;
      }

      $("lista").innerHTML = participantes.map((cliente, indice) => {
        const procedimento = cliente.procedimento || "Procedimento agendado";
        const invalido = Boolean(cliente.procedimentoInvalido);
        const posicao = indice + 1;

        return '<article class="client" data-posicao="' + posicao + '" data-chave="' + esc(chaveCliente(cliente)) + '">' +
          '<div class="clientTop">' +
          '<div class="badge">' + String(posicao).padStart(2, "0") + '</div>' +
          '<div><h2>' + esc(cliente.nome || "Sem nome") + '</h2><p>' + esc(cliente.profissional || "Studio Queens") + '</p></div>' +
          '</div>' +
          '<div class="info">' +
          '<div class="row"><span>Atendimento</span><strong>' + esc(cliente.dataBr || "-") + '</strong></div>' +
          '<div class="row procedure' + (invalido ? " invalidProcedure" : "") + '"><span>Procedimento</span><strong>' + esc(procedimento) + '</strong></div>' +
          '</div>' +
          (invalido ? '<div class="tag">Procedimento inválido para campanha</div>' : '') +
          '</article>';
      }).join("");

      destacarCardGanhadora(resultadoDoPremio(premioAtual));
    }

    function chaveCliente(cliente) {
      return [
        cliente && cliente.idCliente || "",
        cliente && cliente.telefoneFinal || "",
        cliente && cliente.nome || "",
        cliente && cliente.dataApi || cliente && cliente.dataBr || "",
        cliente && cliente.hora || "",
        cliente && cliente.procedimento || ""
      ].join("|");
    }

    function posicaoCliente(cliente) {
      const chave = chaveCliente(cliente);
      const indice = participantes.findIndex(item => chaveCliente(item) === chave);
      return indice >= 0 ? indice + 1 : null;
    }

    function destacarCardGanhadora(cliente) {
      const posicao = posicaoCliente(cliente);

      document.querySelectorAll(".client.winnerCard,.client.invalidWinnerCard").forEach(card => {
        card.classList.remove("winnerCard");
        card.classList.remove("invalidWinnerCard");
      });

      if (!posicao) return;

      const card = document.querySelector('.client[data-posicao="' + posicao + '"]');
      if (!card) return;

      card.classList.add("winnerCard");
    }

    function participantesDisponiveis() {
      const chavesGanhadoras = new Set(resultados.map(chaveCliente));
      return participantes.filter(cliente => {
        const chave = chaveCliente(cliente);
        return !chavesInvalidasSorteadas.has(chave) && !chavesGanhadoras.has(chave);
      });
    }

    function mostrarSorteadaInvalida(cliente) {
      sorteioEmAndamento = false;
      chavesInvalidasSorteadas.add(chaveCliente(cliente));

      const posicao = posicaoCliente(cliente);

      document.querySelectorAll(".client.winnerCard,.client.invalidWinnerCard").forEach(card => {
        card.classList.remove("winnerCard");
        card.classList.remove("invalidWinnerCard");
      });

      const card = posicao ? document.querySelector('.client[data-posicao="' + posicao + '"]') : null;
      if (card) card.classList.add("invalidWinnerCard");

      $("winner").className = "winner invalid";
      $("winner").innerHTML = posicao
        ? "Nº " + String(posicao).padStart(2, "0") + "<br><small>Procedimento inválido. Sorteie novamente.</small>"
        : "Procedimento inválido<br><small>Sorteie novamente.</small>";
      $("hint").textContent = "Essa cliente não conta para a campanha.";
      $("countdown").textContent = "OK";
      $("sortear").textContent = participantesDisponiveis().length ? "Sortear novamente" : "Sem clientes válidas";
      $("sortear").disabled = !participantesDisponiveis().length;

      salvarResultado({
        ...cliente,
        premioNumero: premioAtual,
        tipoResultado: "procedimento_invalido"
      }).catch(() => {
        $("hint").textContent = "Procedimento inválido. Não consegui registrar no Google, mas você pode sortear novamente.";
      });
    }

    function mostrarVencedora(cliente, jaSorteado) {
      if (!cliente.tipoResultado) {
        cliente = {
          ...cliente,
          tipoResultado: "ganhadora"
        };
      }

      sorteioEmAndamento = false;
      cliente = {
        ...cliente,
        premioNumero: numeroPremio(cliente.premioNumero || premioAtual)
      };

      resultados = normalizarResultados([
        ...resultados.filter(item => numeroPremio(item.premioNumero) !== numeroPremio(cliente.premioNumero)),
        cliente
      ]);
      salvarResultadosLocal();
      const posicao = posicaoCliente(cliente);
      $("winner").className = "winner final";
      $("winner").innerHTML = posicao
        ? "Nº " + String(posicao).padStart(2, "0") + "<br><small>Procure a cliente destacada na lista</small>"
        : "Sorteio concluído<br><small>Procure a cliente destacada na lista</small>";
      $("hint").textContent = jaSorteado ? "Este sorteio já tinha uma ganhadora salva." : "Resultado salvo.";
      $("countdown").textContent = "OK";
      $("sortear").textContent = "Sorteado";
      $("sortear").disabled = true;
      renderizarPremios();
      destacarCardGanhadora(cliente);
    }

    function confete() {
      const box = document.querySelector(".draw");
      const cores = ["#e1bd70", "#ffffff", "#7f2146", "#f8e8c3", "#128c55"];

      for (let i = 0; i < 42; i++) {
        const item = document.createElement("i");
        item.className = "confetti";
        item.style.left = Math.floor(Math.random() * 100) + "%";
        item.style.background = cores[i % cores.length];
        item.style.animationDelay = (Math.random() * .5) + "s";
        box.appendChild(item);
        setTimeout(() => item.remove(), 2500);
      }
    }

    async function salvarResultado(cliente) {
      await jsonp({
        acao: "registrarResultadoSorteio",
        s: codigo,
        vencedora: JSON.stringify(cliente)
      });
    }

    function sortearCliente() {
      const disponiveis = participantesDisponiveis();
      if (!disponiveis.length || resultadoDoPremio(premioAtual) || sorteioEmAndamento) return;

      sorteioEmAndamento = true;
      $("sortear").disabled = true;
      $("sortear").textContent = "Sorteando...";
      $("hint").textContent = "Boa sorte!";

      let contador = 3;
      $("countdown").textContent = contador;

      const contagem = setInterval(() => {
        contador--;
        $("countdown").className = "countdown big";
        $("countdown").textContent = contador > 0 ? contador : "Vai!";
        setTimeout(() => $("countdown").className = "countdown", 360);

        if (contador < 0) {
          clearInterval(contagem);
          girarNomes();
        }
      }, 850);
    }

    function girarNomes() {
      const disponiveis = participantesDisponiveis();
      const vencedora = disponiveis[Math.floor(Math.random() * disponiveis.length)];
      let passos = 0;
      const total = 36;

      $("winner").className = "winner sorting";
      $("countdown").textContent = "...";

      const giro = setInterval(() => {
        passos++;
        const listaGiro = participantesDisponiveis();
        const atual = listaGiro[Math.floor(Math.random() * listaGiro.length)] || vencedora;
        $("winner").textContent = atual.nome || "Participante";

        if (passos >= total) {
          clearInterval(giro);

          if (vencedora && vencedora.procedimentoInvalido) {
            mostrarSorteadaInvalida(vencedora);
            return;
          }

          mostrarVencedora({
            ...vencedora,
            premioNumero: premioAtual
          }, false);
          confete();

          salvarResultado({
            ...vencedora,
            premioNumero: premioAtual,
            tipoResultado: "ganhadora"
          }).catch(() => {
            $("hint").textContent = "A ganhadora apareceu, mas não consegui salvar no Google. Anote o nome antes de fechar.";
          });
        }
      }, 90);
    }

    async function iniciar() {
      $("hint").textContent = "Aguardando os dados enviados pelo robô.";

      await new Promise(resolve => setTimeout(resolve, 2600));

      if (recebeuDadosDireto) return;

      try {
        if (!codigo) {
          mostrarErro("Faltou o código do sorteio no link.");
          return;
        }

        const resposta = await buscarSorteioGoogleComTentativas();

        if (!resposta || !resposta.ok || !resposta.sorteio) {
          mostrarErro(resposta && resposta.erro ? resposta.erro : "Não consegui abrir este sorteio.");
          return;
        }

        aplicarSorteio(resposta.sorteio);
      } catch (e) {
        mostrarErro(e.message || "Falha ao conectar com o Google.");
      }
    }

    window.addEventListener("message", event => {
      const mensagem = event.data || {};

      if (mensagem.tipo !== "studioQueensSorteio" || !mensagem.dados) return;
      if (codigo && mensagem.codigo && mensagem.codigo !== codigo) return;
      if (sorteioCarregado || sorteioEmAndamento) return;

      recebeuDadosDireto = true;
      aplicarSorteio(mensagem.dados);
    });

    $("sortear").addEventListener("click", sortearCliente);
    iniciar();
  </script>
</body>
</html>
