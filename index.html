<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio Studio Queens</title>
  <style>
    :root {
      --bg: #f7f1ea;
      --paper: #fffdf9;
      --ink: #151115;
      --muted: #756b71;
      --line: #eadfd4;
      --gold: #c99a4f;
      --wine: #7f2146;
      --green: #128c55;
      --dark: #171014;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(201, 154, 79, .20), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(127, 33, 70, .15), transparent 24%),
        linear-gradient(180deg, #fffaf3 0%, var(--bg) 62%, #efe3d8 100%);
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 24px 14px 46px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .mark {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      color: #e1bd70;
      font-weight: 900;
      border: 2px solid #e1bd70;
      flex: 0 0 auto;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.4fr .8fr .8fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric,
    .draw,
    .client,
    .state {
      background: rgba(255, 253, 249, .92);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(36, 22, 10, .07);
    }

    .metric {
      padding: 14px 16px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 17px;
    }

    .draw {
      position: relative;
      overflow: hidden;
      min-height: 330px;
      margin-bottom: 14px;
      padding: 24px 18px;
      color: #fff;
      border-color: rgba(225, 189, 112, .35);
      background: linear-gradient(135deg, #171014, #2b1722 52%, #551c38);
    }

    .draw::before {
      content: "";
      position: absolute;
      inset: -80px;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(225, 189, 112, .26), transparent 27%),
        radial-gradient(circle at 78% 14%, rgba(255, 255, 255, .12), transparent 20%),
        radial-gradient(circle at 50% 95%, rgba(127, 33, 70, .28), transparent 30%);
    }

    .drawInner {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .drawLabel {
      color: #e1bd70;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .countdown {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffe7b5;
      border: 2px solid rgba(225, 189, 112, .75);
      background: rgba(0, 0, 0, .19);
      font-size: 20px;
      font-weight: 900;
    }

    .countdown.big {
      animation: pulse .72s ease-in-out;
    }

    .winner {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border: 1px solid rgba(225, 189, 112, .45);
      border-radius: 12px;
      background: rgba(255, 255, 255, .07);
      color: #f8e8c3;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.18;
    }

    .winner small {
      display: block;
      color: #dfcdb6;
      margin-top: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .winner.sorting {
      color: #fff;
      animation: shine .22s linear infinite;
    }

    .winner.final {
      border-color: #e1bd70;
      background: rgba(225, 189, 112, .14);
    }

    .hint {
      color: #dfcdb6;
      font-size: 14px;
      margin: 12px 0 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn,
    .linkBtn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
    }

    .btn {
      background: #e1bd70;
      color: #171014;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .78;
    }

    .linkBtn {
      background: var(--green);
      color: #fff;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .client {
      padding: 15px;
    }

    .clientTop {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      align-items: start;
    }

    .badge {
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wine);
      background: #f2e5d6;
      font-weight: 900;
      font-size: 13px;
    }

    .client h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.15;
    }

    .client p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .row {
      border: 1px solid #efe4d8;
      border-radius: 8px;
      padding: 9px 10px;
      background: #fbf7f1;
    }

    .row span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .row strong {
      font-size: 14px;
      word-break: break-word;
    }

    .state {
      padding: 22px;
      color: var(--muted);
      font-size: 16px;
    }

    .confetti {
      position: absolute;
      top: -14px;
      width: 8px;
      height: 14px;
      background: #e1bd70;
      opacity: .95;
      animation: fall 2s linear forwards;
    }

    @keyframes pulse {
      0% { transform: scale(.84); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes shine {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.38); }
      100% { filter: brightness(1); }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); }
      100% { transform: translateY(360px) rotate(560deg); opacity: 0; }
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 20px 12px 32px;
      }

      header {
        gap: 12px;
      }

      h1 {
        font-size: 29px;
      }

      .summary,
      .list,
      .info {
        grid-template-columns: 1fr;
      }

      .winner {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="brand">Studio Queens</div>
        <h1>Sorteio de Clientes</h1>
        <p class="subtitle" id="subtitle">Carregando sorteio...</p>
      </div>
      <div class="mark">SQ</div>
    </header>

    <section class="summary">
      <div class="metric">
        <span>Período</span>
        <strong id="periodo">Carregando...</strong>
      </div>
      <div class="metric">
        <span>Participantes</span>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <span>Regra</span>
        <strong id="regra">-</strong>
      </div>
    </section>

    <section class="draw">
      <div class="drawInner">
        <div class="drawLabel">Sorteio Studio Queens</div>
        <div class="countdown" id="countdown">...</div>
        <div class="winner" id="winner">Buscando participantes.</div>
        <p class="hint" id="hint">Aguarde um instante.</p>
        <div class="actions">
          <button class="btn" id="sortear" type="button" disabled>Sortear cliente</button>
          <a class="linkBtn" id="whatsapp" href="#" target="_blank" rel="noopener" hidden>Chamar ganhadora</a>
        </div>
      </div>
    </section>

    <section class="list" id="lista"></section>
  </main>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbysG8bdGgz9FTO1UTH4drZegPiP3XKHMiGfySx0-aAN7MEiHDc_g1lju7ZQCMMDZ78/exec"
    };

    const params = new URLSearchParams(location.search);
    const codigo = (params.get("s") || "").trim();
    let participantes = [];
    let resultado = null;
    let recebeuDadosDireto = false;

    const $ = id => document.getElementById(id);

    function esc(texto) {
      return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function jsonp(extraParams) {
      return new Promise((resolve, reject) => {
        const callback = "sq_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Tempo esgotado ao conectar com o Google."));
        }, 18000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = data => {
          cleanup();
          resolve(data);
        };

        const url = new URL(CONFIG.apiUrl);
        Object.entries(extraParams).forEach(([chave, valor]) => url.searchParams.set(chave, valor));
        url.searchParams.set("callback", callback);
        script.onerror = () => {
          cleanup();
          reject(new Error("Falha ao carregar dados do Google."));
        };
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function mostrarErro(texto) {
      $("winner").textContent = texto;
      $("hint").textContent = "Gere um novo sorteio pelo robô se precisar.";
      $("lista").innerHTML = '<div class="state">' + esc(texto) + '</div>';
    }

    function aplicarSorteio(sorteio) {
      participantes = Array.isArray(sorteio.participantes) ? sorteio.participantes : [];
      resultado = sorteio.resultado || null;

      $("subtitle").textContent = (sorteio.profissionais || []).join(", ") || "Clientes do mês";
      $("periodo").textContent = (sorteio.inicioBr || "") + " até " + (sorteio.fimBr || "");
      $("total").textContent = String(participantes.length);
      $("regra").textContent = sorteio.regra || "-";
      renderizarLista();

      if (resultado) {
        mostrarVencedora(resultado, true);
        return;
      }

      $("winner").textContent = "Clique em sortear para escolher a ganhadora.";
      $("hint").textContent = "Os nomes vão girar antes do resultado final.";
      $("countdown").textContent = "Pronto";
      $("sortear").disabled = !participantes.length;
    }

    function renderizarLista() {
      if (!participantes.length) {
        $("lista").innerHTML = '<div class="state">Nenhuma participante encontrada neste sorteio.</div>';
        return;
      }

      $("lista").innerHTML = participantes.map((cliente, indice) => {
        return '<article class="client">' +
          '<div class="clientTop">' +
          '<div class="badge">' + String(indice + 1).padStart(2, "0") + '</div>' +
          '<div><h2>' + esc(cliente.nome || "Sem nome") + '</h2><p>' + esc(cliente.profissional || "Studio Queens") + '</p></div>' +
          '</div>' +
          '<div class="info">' +
          '<div class="row"><span>Atendimento</span><strong>' + esc(cliente.dataBr || "-") + '</strong></div>' +
          '<div class="row"><span>Telefone</span><strong>' + esc(cliente.telefoneFinal || "-") + '</strong></div>' +
          '</div>' +
          '</article>';
      }).join("");
    }

    function linkWhatsApp(cliente) {
      const telefone = String(cliente && cliente.telefoneFinal || "").replace(/\D/g, "");
      return telefone ? "https://wa.me/" + telefone : "#";
    }

    function mostrarVencedora(cliente, jaSorteado) {
      resultado = cliente;
      $("winner").className = "winner final";
      $("winner").innerHTML = "Ganhadora: " + esc(cliente.nome || "Sem nome") +
        "<br><small>" + esc(cliente.telefoneFinal || "Sem telefone") + " - " + esc(cliente.profissional || "") + "</small>";
      $("hint").textContent = jaSorteado ? "Este sorteio já tinha uma ganhadora salva." : "Resultado salvo.";
      $("countdown").textContent = "OK";
      $("sortear").textContent = jaSorteado ? "Já sorteado" : "Sorteado";
      $("sortear").disabled = true;

      if (cliente.telefoneFinal) {
        $("whatsapp").href = linkWhatsApp(cliente);
        $("whatsapp").hidden = false;
      }
    }

    function confete() {
      const box = document.querySelector(".draw");
      const cores = ["#e1bd70", "#ffffff", "#7f2146", "#f8e8c3", "#128c55"];

      for (let i = 0; i < 42; i++) {
        const item = document.createElement("i");
        item.className = "confetti";
        item.style.left = Math.floor(Math.random() * 100) + "%";
        item.style.background = cores[i % cores.length];
        item.style.animationDelay = (Math.random() * .5) + "s";
        box.appendChild(item);
        setTimeout(() => item.remove(), 2500);
      }
    }

    async function salvarResultado(cliente) {
      await jsonp({
        acao: "registrarResultadoSorteio",
        s: codigo,
        vencedora: JSON.stringify(cliente)
      });
    }

    function sortearCliente() {
      if (!participantes.length || resultado) return;

      $("sortear").disabled = true;
      $("sortear").textContent = "Sorteando...";
      $("hint").textContent = "Boa sorte!";

      let contador = 3;
      $("countdown").textContent = contador;

      const contagem = setInterval(() => {
        contador--;
        $("countdown").className = "countdown big";
        $("countdown").textContent = contador > 0 ? contador : "Vai!";
        setTimeout(() => $("countdown").className = "countdown", 360);

        if (contador < 0) {
          clearInterval(contagem);
          girarNomes();
        }
      }, 850);
    }

    function girarNomes() {
      const vencedora = participantes[Math.floor(Math.random() * participantes.length)];
      let passos = 0;
      const total = 36;

      $("winner").className = "winner sorting";
      $("countdown").textContent = "...";

      const giro = setInterval(async () => {
        passos++;
        const atual = participantes[Math.floor(Math.random() * participantes.length)];
        $("winner").textContent = atual.nome || "Participante";

        if (passos >= total) {
          clearInterval(giro);
          mostrarVencedora(vencedora, false);
          confete();

          try {
            await salvarResultado(vencedora);
          } catch (e) {
            $("hint").textContent = "A ganhadora apareceu, mas não consegui salvar no Google. Anote o nome antes de fechar.";
          }
        }
      }, 90);
    }

    async function iniciar() {
      $("hint").textContent = "Aguardando os dados enviados pelo robô.";

      await new Promise(resolve => setTimeout(resolve, 2600));

      if (recebeuDadosDireto) return;

      try {
        if (!codigo) {
          mostrarErro("Faltou o código do sorteio no link.");
          return;
        }

        const resposta = await jsonp({ api: "sorteio", s: codigo });

        if (!resposta || !resposta.ok || !resposta.sorteio) {
          mostrarErro(resposta && resposta.erro ? resposta.erro : "Não consegui abrir este sorteio.");
          return;
        }

        aplicarSorteio(resposta.sorteio);
      } catch (e) {
        mostrarErro(e.message || "Falha ao conectar com o Google.");
      }
    }

    window.addEventListener("message", event => {
      const mensagem = event.data || {};

      if (mensagem.tipo !== "studioQueensSorteio" || !mensagem.dados) return;
      if (codigo && mensagem.codigo && mensagem.codigo !== codigo) return;

      recebeuDadosDireto = true;
      aplicarSorteio(mensagem.dados);
    });

    $("sortear").addEventListener("click", sortearCliente);
    iniciar();
  </script>
</body>
</html>
