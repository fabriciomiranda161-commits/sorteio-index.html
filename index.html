<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio Studio Queens</title>
  <style>
    :root {
      --bg: #0f0b0d;
      --panel: #181012;
      --panel-soft: #23171a;
      --paper: #fffaf2;
      --ink: #fff6e8;
      --muted: #c7b8a4;
      --line: rgba(225, 190, 126, .22);
      --gold: #d9b66d;
      --gold-strong: #f1d08c;
      --wine: #7e2148;
      --green: #0f8d5a;
      --shadow: rgba(0, 0, 0, .32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(217, 182, 109, .20), transparent 25%),
        radial-gradient(circle at 86% 12%, rgba(126, 33, 72, .34), transparent 28%),
        linear-gradient(135deg, #0f0b0d 0%, #171013 45%, #2d1420 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 72%);
    }

    .wrap {
      position: relative;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 34px 18px 54px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.05;
      color: #fff8eb;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .mark {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 32% 20%, #3d2c1d, #080607 64%);
      color: var(--gold-strong);
      font-weight: 900;
      border: 1px solid rgba(241, 208, 140, .72);
      box-shadow: 0 0 0 6px rgba(217, 182, 109, .08), 0 16px 34px var(--shadow);
      flex: 0 0 auto;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.4fr .8fr .8fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric,
    .client,
    .state {
      background: rgba(255, 250, 242, .08);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 44px var(--shadow);
      backdrop-filter: blur(16px);
    }

    .metric {
      min-height: 82px;
      padding: 17px 18px;
    }

    .metric span {
      display: block;
      color: #d9cbb8;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 17px;
      color: #fff8eb;
    }

    .draw {
      position: relative;
      overflow: hidden;
      min-height: 420px;
      margin-bottom: 18px;
      padding: 34px 22px;
      color: #fff;
      border: 1px solid rgba(241, 208, 140, .26);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015)),
        radial-gradient(circle at 50% -12%, rgba(241, 208, 140, .25), transparent 28%),
        linear-gradient(145deg, #150e11 0%, #241318 45%, #591a39 100%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .42);
    }

    .draw::before {
      content: "";
      position: absolute;
      inset: -80px;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(241, 208, 140, .18), transparent 24%),
        radial-gradient(circle at 76% 22%, rgba(255, 255, 255, .11), transparent 18%),
        linear-gradient(90deg, transparent, rgba(241, 208, 140, .10), transparent);
      transform: rotate(-8deg);
    }

    .drawInner {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .drawLabel {
      color: var(--gold-strong);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .countdown {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff4d8;
      border: 1px solid rgba(241, 208, 140, .88);
      background: radial-gradient(circle at 50% 30%, rgba(241, 208, 140, .18), rgba(0, 0, 0, .24));
      font-size: 22px;
      font-weight: 900;
      box-shadow: inset 0 0 22px rgba(241, 208, 140, .10), 0 0 0 10px rgba(241, 208, 140, .06);
    }

    .countdown.big {
      animation: pulse .72s ease-in-out;
    }

    .winner {
      min-height: 136px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 1px solid rgba(241, 208, 140, .38);
      border-radius: 18px;
      background: rgba(12, 8, 9, .38);
      color: #fff1c8;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.12;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .winner small {
      display: block;
      color: #ddcdb6;
      margin-top: 12px;
      font-size: 14px;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      font-weight: 800;
    }

    .winner.sorting {
      color: #fff;
      animation: shine .22s linear infinite;
    }

    .winner.final {
      border-color: rgba(241, 208, 140, .78);
      background: linear-gradient(135deg, rgba(241, 208, 140, .14), rgba(255, 255, 255, .05));
    }

    .hint {
      color: #d8c7b0;
      font-size: 14px;
      margin: 14px 0 0;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn,
    .linkBtn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .btn {
      background: linear-gradient(135deg, #f1d08c, #bd8840);
      color: #171014;
      box-shadow: 0 14px 28px rgba(0, 0, 0, .22);
    }

    .btn:hover,
    .linkBtn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .78;
    }

    .linkBtn {
      background: linear-gradient(135deg, #15a66c, #087548);
      color: #fff;
      box-shadow: 0 14px 28px rgba(0, 0, 0, .22);
    }

    .list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .client {
      padding: 16px;
    }

    .clientTop {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: start;
    }

    .badge {
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1012;
      background: linear-gradient(135deg, #f4d999, #c99a4f);
      font-weight: 900;
      font-size: 13px;
    }

    .client h2 {
      margin: 0;
      color: #fff8eb;
      font-size: 18px;
      line-height: 1.15;
    }

    .client p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .row {
      border: 1px solid rgba(225, 190, 126, .16);
      border-radius: 12px;
      padding: 10px 11px;
      background: rgba(255, 250, 242, .07);
    }

    .row span {
      display: block;
      color: #bba994;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .row strong {
      color: #fff6e8;
      font-size: 14px;
      word-break: break-word;
    }

    .state {
      padding: 22px;
      color: #dccdb9;
      font-size: 16px;
    }

    .confetti {
      position: absolute;
      top: -14px;
      width: 8px;
      height: 14px;
      background: var(--gold-strong);
      opacity: .95;
      animation: fall 2s linear forwards;
    }

    @keyframes pulse {
      0% { transform: scale(.84); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    @keyframes shine {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.38); }
      100% { filter: brightness(1); }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); }
      100% { transform: translateY(360px) rotate(560deg); opacity: 0; }
    }

    @media (max-width: 920px) {
      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .wrap {
        padding: 24px 12px 34px;
      }

      header {
        gap: 12px;
      }

      h1 {
        font-size: 34px;
      }

      .summary,
      .list,
      .info {
        grid-template-columns: 1fr;
      }

      .draw {
        min-height: 360px;
        padding: 26px 14px;
        border-radius: 20px;
      }

      .countdown {
        width: 88px;
        height: 88px;
      }

      .winner {
        min-height: 120px;
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <div class="brand">Studio Queens</div>
        <h1>Sorteio de Clientes</h1>
        <p class="subtitle" id="subtitle">Carregando sorteio...</p>
      </div>
      <div class="mark">SQ</div>
    </header>

    <section class="summary">
      <div class="metric">
        <span>Período</span>
        <strong id="periodo">Carregando...</strong>
      </div>
      <div class="metric">
        <span>Participantes</span>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <span>Regra</span>
        <strong id="regra">-</strong>
      </div>
    </section>

    <section class="draw">
      <div class="drawInner">
        <div class="drawLabel">Sorteio Studio Queens</div>
        <div class="countdown" id="countdown">...</div>
        <div class="winner" id="winner">Buscando participantes.</div>
        <p class="hint" id="hint">Aguarde um instante.</p>
        <div class="actions">
          <button class="btn" id="sortear" type="button" disabled>Sortear cliente</button>
          <a class="linkBtn" id="whatsapp" href="#" target="_blank" rel="noopener" hidden>Chamar ganhadora</a>
        </div>
      </div>
    </section>

    <section class="list" id="lista"></section>
  </main>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbysG8bdGgz9FTO1UTH4drZegPiP3XKHMiGfySx0-aAN7MEiHDc_g1lju7ZQCMMDZ78/exec"
    };

    const params = new URLSearchParams(location.search);
    const codigo = (params.get("s") || "").trim();
    let participantes = [];
    let resultado = null;
    let recebeuDadosDireto = false;

    const $ = id => document.getElementById(id);

    function esc(texto) {
      return String(texto == null ? "" : texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function jsonp(extraParams) {
      return new Promise((resolve, reject) => {
        const callback = "sq_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Tempo esgotado ao conectar com o Google."));
        }, 18000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        window[callback] = data => {
          cleanup();
          resolve(data);
        };

        const url = new URL(CONFIG.apiUrl);
        Object.entries(extraParams).forEach(([chave, valor]) => url.searchParams.set(chave, valor));
        url.searchParams.set("callback", callback);
        script.onerror = () => {
          cleanup();
          reject(new Error("Falha ao carregar dados do Google."));
        };
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    function mostrarErro(texto) {
      $("winner").textContent = texto;
      $("hint").textContent = "Gere um novo sorteio pelo robô se precisar.";
      $("lista").innerHTML = '<div class="state">' + esc(texto) + '</div>';
    }

    function aplicarSorteio(sorteio) {
      participantes = Array.isArray(sorteio.participantes) ? sorteio.participantes : [];
      resultado = sorteio.resultado || null;

      $("subtitle").textContent = (sorteio.profissionais || []).join(", ") || "Clientes do mês";
      $("periodo").textContent = (sorteio.inicioBr || "") + " até " + (sorteio.fimBr || "");
      $("total").textContent = String(participantes.length);
      $("regra").textContent = sorteio.regra || "-";
      renderizarLista();

      if (resultado) {
        mostrarVencedora(resultado, true);
        return;
      }

      $("winner").textContent = "Clique em sortear para escolher a ganhadora.";
      $("hint").textContent = "Os nomes vão girar antes do resultado final.";
      $("countdown").textContent = "Pronto";
      $("sortear").disabled = !participantes.length;
    }

    function renderizarLista() {
      if (!participantes.length) {
        $("lista").innerHTML = '<div class="state">Nenhuma participante encontrada neste sorteio.</div>';
        return;
      }

      $("lista").innerHTML = participantes.map((cliente, indice) => {
        return '<article class="client">' +
          '<div class="clientTop">' +
          '<div class="badge">' + String(indice + 1).padStart(2, "0") + '</div>' +
          '<div><h2>' + esc(cliente.nome || "Sem nome") + '</h2><p>' + esc(cliente.profissional || "Studio Queens") + '</p></div>' +
          '</div>' +
          '<div class="info">' +
          '<div class="row"><span>Atendimento</span><strong>' + esc(cliente.dataBr || "-") + '</strong></div>' +
          '<div class="row"><span>Telefone</span><strong>' + esc(cliente.telefoneFinal || "-") + '</strong></div>' +
          '</div>' +
          '</article>';
      }).join("");
    }

    function linkWhatsApp(cliente) {
      const telefone = String(cliente && cliente.telefoneFinal || "").replace(/\D/g, "");
      return telefone ? "https://wa.me/" + telefone : "#";
    }

    function mostrarVencedora(cliente, jaSorteado) {
      resultado = cliente;
      $("winner").className = "winner final";
      $("winner").innerHTML = "Ganhadora: " + esc(cliente.nome || "Sem nome") +
        "<br><small>" + esc(cliente.telefoneFinal || "Sem telefone") + " - " + esc(cliente.profissional || "") + "</small>";
      $("hint").textContent = jaSorteado ? "Este sorteio já tinha uma ganhadora salva." : "Resultado salvo.";
      $("countdown").textContent = "OK";
      $("sortear").textContent = jaSorteado ? "Já sorteado" : "Sorteado";
      $("sortear").disabled = true;

      if (cliente.telefoneFinal) {
        $("whatsapp").href = linkWhatsApp(cliente);
        $("whatsapp").hidden = false;
      }
    }

    function confete() {
      const box = document.querySelector(".draw");
      const cores = ["#e1bd70", "#ffffff", "#7f2146", "#f8e8c3", "#128c55"];

      for (let i = 0; i < 42; i++) {
        const item = document.createElement("i");
        item.className = "confetti";
        item.style.left = Math.floor(Math.random() * 100) + "%";
        item.style.background = cores[i % cores.length];
        item.style.animationDelay = (Math.random() * .5) + "s";
        box.appendChild(item);
        setTimeout(() => item.remove(), 2500);
      }
    }

    async function salvarResultado(cliente) {
      await jsonp({
        acao: "registrarResultadoSorteio",
        s: codigo,
        vencedora: JSON.stringify(cliente)
      });
    }

    function sortearCliente() {
      if (!participantes.length || resultado) return;

      $("sortear").disabled = true;
      $("sortear").textContent = "Sorteando...";
      $("hint").textContent = "Boa sorte!";

      let contador = 3;
      $("countdown").textContent = contador;

      const contagem = setInterval(() => {
        contador--;
        $("countdown").className = "countdown big";
        $("countdown").textContent = contador > 0 ? contador : "Vai!";
        setTimeout(() => $("countdown").className = "countdown", 360);

        if (contador < 0) {
          clearInterval(contagem);
          girarNomes();
        }
      }, 850);
    }

    function girarNomes() {
      const vencedora = participantes[Math.floor(Math.random() * participantes.length)];
      let passos = 0;
      const total = 36;

      $("winner").className = "winner sorting";
      $("countdown").textContent = "...";

      const giro = setInterval(async () => {
        passos++;
        const atual = participantes[Math.floor(Math.random() * participantes.length)];
        $("winner").textContent = atual.nome || "Participante";

        if (passos >= total) {
          clearInterval(giro);
          mostrarVencedora(vencedora, false);
          confete();

          try {
            await salvarResultado(vencedora);
          } catch (e) {
            $("hint").textContent = "A ganhadora apareceu, mas não consegui salvar no Google. Anote o nome antes de fechar.";
          }
        }
      }, 90);
    }

    async function iniciar() {
      $("hint").textContent = "Aguardando os dados enviados pelo robô.";

      await new Promise(resolve => setTimeout(resolve, 2600));

      if (recebeuDadosDireto) return;

      try {
        if (!codigo) {
          mostrarErro("Faltou o código do sorteio no link.");
          return;
        }

        const resposta = await jsonp({ api: "sorteio", s: codigo });

        if (!resposta || !resposta.ok || !resposta.sorteio) {
          mostrarErro(resposta && resposta.erro ? resposta.erro : "Não consegui abrir este sorteio.");
          return;
        }

        aplicarSorteio(resposta.sorteio);
      } catch (e) {
        mostrarErro(e.message || "Falha ao conectar com o Google.");
      }
    }

    window.addEventListener("message", event => {
      const mensagem = event.data || {};

      if (mensagem.tipo !== "studioQueensSorteio" || !mensagem.dados) return;
      if (codigo && mensagem.codigo && mensagem.codigo !== codigo) return;

      recebeuDadosDireto = true;
      aplicarSorteio(mensagem.dados);
    });

    $("sortear").addEventListener("click", sortearCliente);
    iniciar();
  </script>
</body>
</html>
